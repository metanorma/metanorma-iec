# The metanorma-iec CitationStyle instance (relaton-render 3.0.0.pre
# Iso690 engine). Creators render as a small-cap serial list in the
# declared case; standards carry the stddocTitle emphasis, with ISO and
# IEC documents treated as the flavor's home.
name: "IEC citation style"
scheme:
  system: name-date
  nameForm:
    initials: true
    initialsSeparator: ""
    invertedAll: true
    surnameUpcase: false
    listStyle: serial
    orgUpcase: false
  homeDocidType: ["ISO", "IEC"]
  locale:
    labels:
      in: ""
      "and": "&"
      oxford_comma: ","
      no_place: "n.p."
      available_from: "Available at:"
      edition: "edition"
      edition_1: "First edition"
      edition_2: "Second edition"
      edition_3: "Third edition"
      edition_4: "Fourth edition"
      edition_5: "Fifth edition"
      edition_6: "Sixth edition"
      edition_7: "Seventh edition"
      edition_8: "Eighth edition"
      edition_9: "Ninth edition"
      edition_10: "Tenth edition"
      edition_11: "Eleventh edition"
      edition_12: "Twelfth edition"
templates:
  titleOpen: "<em>"
  titleClose: "</em>"
  # numeric citations: the citeas stands
  citation: ""
  reference: "{{creator}}. {{title}}. {{date}}. {{identifier}}."
  name: "{{surname}} {{givenNames}}"
  creators: "<smallcap>{{names}}</smallcap>"
  series: "({{series_title}} {{series_number}})"
  uri: "<span class='biburl'><fmt-link target='{{uri}}'>{{uri}}</fmt-link></span>"
  uriShort: "<fmt-link target='{{uri}}'>{{uri}}</fmt-link>"
perType:
  - type: monograph
    short: "{{creator}}. {{title}}. {{date}}. {{location}}"
    template: "{{creator}}. {{title}}. {{medium}}. {{edition}}. {{series}}. {{production}}. {{date}}. {{size}}."
    noPlace: true
    fallbacks:
      date: "n.d"
  - type: component_part
    short: "{{creator}}. {{title}}. {{date}}. {{location}}"
    template: "{{creator}}. {{title}}. {{componentpart}}. {{date}}. {{extent}}. {{access}}."
    noPlace: true
  - type: continuing
    short: "{{creator}}. {{title}}. {{date}}. {{location}}"
    template: "{{title}}. {{date}}."
    fallbacks:
      date: "n.d"
  - type: serial_part
    short: "{{creator}}. {{title}}. {{date}}. {{location}}"
    template: "{{creator}}. {{title}}. {{series}}. {{date}}, {{extent}}."
    series: "<em>{{series_title}}</em> ({{series_run}})"
  - type: report
    template: "{{creator}}. {{title}}. {{stddoc}}. {{location}}."
    short: "{{creator}}. {{title}}. {{date}}"
    title: "<span class='stddocTitle'>{{title}}</span>"
    home: false
  - type: report
    template: "{{title}}"
    short: "{{creator}}. {{title}}. {{date}}"
    title: "<span class='stddocTitle'>{{title}}</span>"
    home: true
  - type: online
    short: "{{creator}}. {{title}}. {{date}}. {{location}}"
    template: "{{creator}}. {{title}}. {{edition}}. {{medium}}. {{production}}. {{date}}. {{location}}. {{size}}. {{access}}."
  - type: webdoc
    template: "{{creator}}. {{title}} {{medium}}. {{production}}. {{date}}. {{location}}. {{access}}."
    short: "{{creator}}. {{title}}. {{date}}. {{location}}"
    title: "<span class='stddocTitle'>{{title}}</span>"
